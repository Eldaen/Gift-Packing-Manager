name: iosApp
options:
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: ru
packages:
  Shared:
    path: ../SharedPackage
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - 'Preview Content'
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: orgIdentifier.iosApp
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: Shared
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iosAppUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: orgIdentifier.iosAppUITests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    test:
      targets: [iosAppUITests]
